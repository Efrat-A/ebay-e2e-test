[pytest]
testpaths = tests
pythonpath = .
markers =
    e2e: end-to-end browser tests against eBay
addopts = -v --alluredir=reports/allure-results --junitxml=reports/junit.xml

# Shared log format. log_format/log_date_format apply wherever pytest shows captured logs
# (a failure's "Captured log" section, --junitxml) regardless of log_cli; log_cli_format only
# matters once log_cli is turned on below, for live streaming during the run.
# log_level = INFO is required too - pytest's default capture level is WARNING, which would
# silently drop every INFO log this project's pages/flows/utils emit (login, search, cart steps).
log_level = INFO
log_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_date_format = %H:%M:%S
log_cli_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

;log_cli = true
;log_cli_level = INFO

# Browser visibility. Precedence: --headless/--headed flag > HEADLESS env var > this value > config profile
headless = true
