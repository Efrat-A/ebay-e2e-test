# Environment profiles. Select with:  pytest --profile=ci   or   ENV_PROFILE=ci
default_profile: local

profiles:
  local:
    base_url: "https://www.ebay.com"
    cart_url: "https://cart.ebay.com"
    browser: chromium          # chromium | firefox | webkit
    headless: false
    slow_mo_ms: 500   # pause after each browser action - slower pace, less likely to trigger eBay's bot protection (403)
    viewport: { width: 1440, height: 900 }
    locale: "en-US"
    timeouts:
      default_ms: 15000
      navigation_ms: 30000
    retry:
      attempts: 3
      delay_sec: 1.5
      page_error_retries: 2        # tries again when an error page is shown (403/429/5xx, 'Access Denied', 'Please go back and try again')
      page_error_backoff_sec: 3    # pause before refresh: 3s, then 6s, 12s...
    trace: retain-on-failure   # on | off | retain-on-failure
    price_range_strategy: max  # "$10 to $20" -> 20 (conservative, keeps cart under budget)
    guest_fallback_on_challenge: true   # login CAPTCHA -> continue as guest (logged in report)
    skip_on_bot_protection: false   # true: a CAPTCHA/403/429 anywhere reports as SKIPPED instead of broken/failed

  ci:
    base_url: "https://www.ebay.com"
    cart_url: "https://cart.ebay.com"
    browser: chromium
    headless: true
    slow_mo_ms: 500
    viewport: { width: 1440, height: 900 }
    locale: "en-US"
    timeouts:
      default_ms: 20000
      navigation_ms: 45000
    retry:
      attempts: 3
      delay_sec: 2
      page_error_retries: 2
      page_error_backoff_sec: 5
    trace: on
    price_range_strategy: max
    guest_fallback_on_challenge: false  # CI: a blocked login is a failure
    skip_on_bot_protection: false   # true: a CAPTCHA/403/429 anywhere reports as SKIPPED instead of broken/failed

  # Experiment: browser identity used in another public solution of this assignment
  # (AlonHrtmn/ebay-testing). Fixed desktop-Chrome User-Agent, US locale/timezone,
  # Full-HD viewport. Run:  make e2e PROFILE=realistic_ua   and compare with the default.
  realistic_ua:
    extends: local
    viewport: { width: 1920, height: 1080 }
    device_scale_factor: 1
    locale: "en-US"
    timezone_id: "America/New_York"
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
